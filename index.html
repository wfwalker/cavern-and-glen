<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavern and Glen</title>
    <style>
        @font-face {
            font-family: 'Web437_IBM_BIOS';
            /* Vite serves the public/ directory directly from the forward slash */
            src: url('/fonts/Web437_IBM_BIOS.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #C0B89B;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }


        canvas {
            width: 90vw;
            max-width: 1080px; /* Caps out at a sharp 2x vertical scale */
            
            /* Force the canvas box into a classic television/CRT shape */
            height: auto; 
            aspect-ratio: 4 / 3;

            /* 2. Keeps the upscaled retro pixels razor sharp */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script type="module" src="/src/engine.ts"></script>
</body>
</html>
